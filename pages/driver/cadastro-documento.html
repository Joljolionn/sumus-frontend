<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aeterna - Upload de Documentos</title>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,800&family=Inter:wght@400;500;600;700&display=swap"
  />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
  />
  <link rel="stylesheet" href="../../assets/css/pages/driver/cadastro-documento/index.css" />
</head>
<body class="document-page">
  <nav class="topbar">
    <div class="topbar__content">
      <div class="topbar__brand">SUMUS</div>
      <div class="topbar__menu">
        <a class="topbar__link" href="#">Viajar</a>
        <a class="topbar__link" href="#">Ganhe Dinheiro</a>
        <a class="topbar__link" href="#">Sobre</a>
      </div>
      <div class="topbar__actions">
        <button class="topbar__login" type="button">Fazer Login</button>
        <button class="topbar__signup" type="button">Cadastre-se</button>
      </div>
    </div>
  </nav>

  <main class="document-main">
    <section class="upload-shell">
      <div class="upload-card">
        <div class="upload-card__header">
          <h2 class="upload-card__title">Envio de Documentação</h2>
          <p class="upload-card__subtitle">
            Por favor, envie os arquivos necessários para validar sua conta.
          </p>
        </div>

        <div class="upload-grid">
          <label class="upload-option" for="id-upload">
            <div class="upload-option__icon">
              <span class="material-symbols-outlined">badge</span>
            </div>
            <h3 class="upload-option__title">Upload de Identificação</h3>
            <p class="upload-option__description">
              Arraste ou selecione sua CNH ou RG (frente e verso)
            </p>
            <input class="hidden" id="id-upload" type="file" />
          </label>

          <label class="upload-option" for="vehicle-upload">
            <div class="upload-option__icon">
              <span class="material-symbols-outlined">directions_car</span>
            </div>
            <h3 class="upload-option__title">Documentação do Veículo</h3>
            <p class="upload-option__description">
              Arraste ou selecione o CRLV e fotos do veículo
            </p>
            <input class="hidden" id="vehicle-upload" type="file" />
          </label>
        </div>

        <button class="upload-submit" type="button">
          <span class="material-symbols-outlined">cloud_upload</span>
          Enviar Documentos
        </button>

        <p class="upload-card__footnote">
          Seus dados são protegidos por criptografia de ponta a ponta.
        </p>
      </div>
    </section>
  </main>

  <footer class="page-footer">
    <div class="page-footer__content">
      <div class="page-footer__brand-group">
        <span class="page-footer__brand">SUMUS</span>
        <span class="page-footer__divider">|</span>
        <p class="page-footer__copy">© 2024 SUMUS. Dignified Mobility.</p>
      </div>
      <div class="page-footer__links">
        <a class="page-footer__link" href="#">Privacy</a>
        <a class="page-footer__link" href="#">Terms</a>
        <a class="page-footer__link" href="#">Contact</a>
      </div>
    </div>
  </footer>
</body>
</html>
