<!DOCTYPE html>
<html class="light" lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Aeterna - Verificação</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <link href="../../assets/css/pages/driver/codigo-otp/index.css" rel="stylesheet" />
</head>

<body class="otp-page">
  <nav class="topbar">
    <div class="topbar__content">
      <div class="topbar__brand">SUMUS</div>

      <div class="topbar__menu">
        <a class="topbar__link" href="#">Viajar</a>
        <a class="topbar__link" href="#">Ganhe Dinheiro</a>
        <a class="topbar__link" href="#">Sobre</a>
      </div>

      <div class="topbar__actions">
        <button class="topbar__login" type="button">Fazer Login</button>
        <button class="topbar__signup" type="button">Cadastre-se</button>
      </div>
    </div>
  </nav>

  <main class="otp-main">
    <div class="otp-shell">
      <div class="otp-shell__heading">
        <h2 class="otp-shell__title">Verificação</h2>
        <p class="otp-shell__subtitle">
          Insira o código enviado para seu e-mail
        </p>
      </div>

      <div class="otp-card">
        <div class="otp-card__panel">
          <form class="otp-form">
            <div class="otp-form__field">
              <label class="otp-form__label" for="code-1">Código de verificação</label>
              <div class="otp-form__inputs">
                <input class="otp-form__input" id="code-1" maxlength="1" name="code-1" placeholder="•" type="text" />
                <input class="otp-form__input" id="code-2" maxlength="1" name="code-2" placeholder="•" type="text" />
                <input class="otp-form__input" id="code-3" maxlength="1" name="code-3" placeholder="•" type="text" />
                <input class="otp-form__input" id="code-4" maxlength="1" name="code-4" placeholder="•" type="text" />
                <input class="otp-form__input" id="code-5" maxlength="1" name="code-5" placeholder="•" type="text" />
                <input class="otp-form__input" id="code-6" maxlength="1" name="code-6" placeholder="•" type="text" />
              </div>
            </div>

            <button class="otp-form__submit" type="submit">
              <span>Verify Code</span>
              <span class="material-symbols-outlined otp-form__submit-icon">verified_user</span>
            </button>
          </form>
        </div>

        <div class="otp-card__corner otp-card__corner--top"></div>
        <div class="otp-card__corner otp-card__corner--bottom"></div>
      </div>

      <div class="otp-shell__footer">
        <button class="otp-shell__resend" type="button">
          <span>Não recebeu o código?</span>
          <span class="otp-shell__resend-highlight">Reenviar código</span>
        </button>
        <a class="otp-shell__back-link" href="#">Voltar para o login</a>
      </div>
    </div>
  </main>

  <footer class="page-footer">
    <div class="page-footer__content">
      <div class="page-footer__brand-group">
        <span class="page-footer__brand">SUMUS</span>
        <span class="page-footer__divider">|</span>
        <p class="page-footer__copy">© 2024 SUMUS. Dignified Mobility.</p>
      </div>

      <div class="page-footer__links">
        <a class="page-footer__link" href="#">Privacy</a>
        <a class="page-footer__link" href="#">Terms</a>
        <a class="page-footer__link" href="#">Contact</a>
      </div>
    </div>
  </footer>

  <script>
    const inputs = document.querySelectorAll(".otp-form__input");
    inputs.forEach((input, index) => {
      input.addEventListener("input", (e) => {
        if (e.target.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !e.target.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });
  </script>
</body>

</html>
