    <!-- MAIN -->
    <main class="admin-approval-main">

  <!-- MODAL PDF -->
  <div id="pdf-modal" class="pdf-modal hidden">
    <div class="pdf-modal__overlay" onclick="fecharModal()"></div>

    <div class="pdf-modal__content">
      <button class="pdf-modal__close" onclick="fecharModal()">✕</button>

      <iframe id="pdf-frame"></iframe>
    </div>
  </div>
<script>
  let currentPdfUrl = "";

  function abrirModal(url) {
    const modal = document.getElementById("pdf-modal");
    const frame = document.getElementById("pdf-frame");

    currentPdfUrl = url;

    // tenta mostrar (se funcionar, ótimo)
    frame.src = url;

    modal.classList.remove("hidden");
  }

  function abrirNovaAba() {
    if (currentPdfUrl) {
      window.open(currentPdfUrl, "_blank");
    }
  }

  function fecharModal() {
    document.getElementById("pdf-modal").classList.add("hidden");
    document.getElementById("pdf-frame").src = "";
  }
  function abrirModal(url) {
  const modal = document.getElementById("pdf-modal");
  const frame = document.getElementById("pdf-frame");

  currentPdfUrl = url;

  // #view=FitH -> Ajusta pela altura
  // #view=FitW -> Ajusta pela largura (Geralmente o melhor para preencher tudo)
  // toolbar=0  -> Opcional: esconde a barra de ferramentas do navegador
  frame.src = `${url}#view=FitW&toolbar=0`;

  modal.classList.remove("hidden");
}
</script>
  <script src="../../assets/js//admin/aprovacao-motorista.js"></script>
