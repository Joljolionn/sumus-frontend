<body class="admin-passenger-approval-page">

    <!-- SIDEBAR (mantido igual) -->

      <nav class="sidebar__nav">
        <a class="sidebar__link sidebar__link--active" href="./dashboard.html">
          <span class="material-symbols-outlined">grid_view</span>
          <span>Dashboard</span>
        </a>
        <a class="sidebar__link" href="./aprovacao-passageiro.html">
          <span class="material-symbols-outlined">accessible_forward</span>
          <span>Aprovacao de Passageiros</span>
        </a>
        <a class="sidebar__link" href="./aprovacao-motorista.html">
          <span class="material-symbols-outlined">verified_user</span>
          <span>Aprovacao de Motoristas</span>
        </a>
        <a class="sidebar__link" href="./gestao.html">
          <span class="material-symbols-outlined">admin_panel_settings</span>
          <span>Gestao Administrativa</span>
        </a>
        <a class="sidebar__link" href="./loginadmin.html">
          <span class="material-symbols-outlined">login</span>
          <span>Trocar conta</span>
        </a>

        <div class="sidebar__divider"></div>

        <a class="sidebar__link" href="#">
          <span class="material-symbols-outlined">settings</span>
          <span>Configuracoes</span>
        </a>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="admin-passenger-approval-main">
      <div class="admin-passenger-approval-shell">

        <!-- HEADER (mantido igual) -->
        <header class="admin-passenger-approval-header">
          <div>
            <p class="admin-passenger-approval-header__eyebrow">Validacao PCD</p>
            <h1 class="admin-passenger-approval-header__title">
              Fila de Aprovacao de Passageiros

        </header>

        <!-- LISTA DINÂMICA -->

          <p>Carregando passageiros...</p>
        </section>

      </div>
    </main>
  </div>

  <!-- 🔥 MODAL PDF -->
  <div id="pdf-modal" class="pdf-modal hidden">
    <div class="pdf-modal__overlay" onclick="fecharModal()"></div>

    <div class="pdf-modal__content">
      <button class="pdf-modal__close" onclick="fecharModal()">✕</button>
      <iframe id="pdf-frame"></iframe>
    </div>
  </div>

  <!-- 🔥 JS DO MODAL -->
<script>
  let currentPdfUrl = "";

  function abrirModal(url) {
    const modal = document.getElementById("pdf-modal");
    const frame = document.getElementById("pdf-frame");

    currentPdfUrl = url;

    // tenta mostrar (se funcionar, ótimo)
    frame.src = url;

    modal.classList.remove("hidden");
  }

  function abrirNovaAba() {
    if (currentPdfUrl) {
      window.open(currentPdfUrl, "_blank");
    }
  }

  function fecharModal() {
    document.getElementById("pdf-modal").classList.add("hidden");
    document.getElementById("pdf-frame").src = "";
  }
  function abrirModal(url) {
  const modal = document.getElementById("pdf-modal");
  const frame = document.getElementById("pdf-frame");

  currentPdfUrl = url;

  // #view=FitH -> Ajusta pela altura
  // #view=FitW -> Ajusta pela largura (Geralmente o melhor para preencher tudo)
  // toolbar=0  -> Opcional: esconde a barra de ferramentas do navegador
  frame.src = `${url}#view=FitW&toolbar=0`;

  modal.classList.remove("hidden");
}
</script>
  <!-- 🔥 JS PRINCIPAL -->
  <script src="../../assets/js/aprovacao-passageiro.js"></script>

</body>
